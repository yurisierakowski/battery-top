name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts libncurses-dev lintian

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian ../battery-top_*.deb || true

      - name: Collect artifacts
        run: |
          shopt -s nullglob
          mkdir -p dist
          mv ../battery-top_*.deb ../battery-top_*.changes ../battery-top_*.buildinfo dist/
          # dh_strip only emits a separate -dbgsym package when there are
          # debug symbols to split out; don't fail the build if it didn't.
          mv ../battery-top-dbgsym_*.deb dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: battery-top-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/battery-top_*.deb
