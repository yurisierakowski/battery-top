name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # needed for softprops/action-gh-release to create/update releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts libncurses-dev lintian

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian ../battery-top_*.deb || true

      - name: Collect artifacts
        run: |
          shopt -s nullglob
          mkdir -p dist
          mv ../battery-top_*.deb ../battery-top_*.changes ../battery-top_*.buildinfo dist/
          # dh_strip only emits a separate -dbgsym package when there are
          # debug symbols to split out; don't fail the build if it didn't.
          mv ../battery-top-dbgsym_*.deb dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: battery-top-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/battery-top_*.deb

  # Publishes a minimal signed "flat" APT repository (single directory, no
  # dists/pool hierarchy) to GitHub Pages, so `apt-get install battery-top`
  # works after adding the repo -- see README.md for the sources.list line.
  # Runs only for tagged releases; every tag replaces the repo with just
  # that version, so apt always points at the latest release.
  publish-apt-repo:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: battery-top-deb
          path: repo

      - name: Install repo-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      - name: Build and sign repository metadata
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')

          cd repo
          # Public key, in both forms users need: dearmored for
          # /usr/share/keyrings (apt's [signed-by=] option), armored for
          # anyone who wants to inspect/import it manually.
          gpg --export "$KEYID" > battery-top-archive-keyring.gpg
          gpg --armor --export "$KEYID" > battery-top-archive-keyring.asc

          apt-ftparchive packages . > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive -o APT::FTPArchive::Release::Origin=battery-top \
                          -o APT::FTPArchive::Release::Label=battery-top \
                          -o APT::FTPArchive::Release::Description="battery-top APT repository" \
                          release . > Release

          gpg --batch --yes --default-key "$KEYID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$KEYID" --detach-sign -o Release.gpg Release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - id: deployment
        uses: actions/deploy-pages@v4
